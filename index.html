<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pendu Twitch</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

#game {
    width: 420px;
    height: 460px;
    margin: 0 auto;
    padding: 12px;
    text-align: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
}

h1 {
    margin: 0 0 5px 0;
    font-size: 28px;
}

#hangman {
    height: 180px;
    white-space: pre;
    font-family: monospace;
    font-size: 23px;
    line-height: 24px;
}

#word {
    margin: 5px 0 12px 0;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
}

#wrong {
    font-size: 16px;
    margin-top: 8px;
}

#lastGuess {
    margin-top: 10px;
    font-size: 17px;
    min-height: 22px;
}

#status {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
}

#connection {
    margin-top: 8px;
    font-size: 12px;
    opacity: 0.75;
}

.username {
    font-weight: bold;
}

.good {
    font-weight: bold;
}

.bad {
    opacity: 0.85;
}
</style>
</head>

<body>

<div id="game">

    <h1>LE PENDU</h1>

    <div id="hangman"></div>

    <div id="word">
        CHARGEMENT...
    </div>

    <div id="wrong">
        Lettres incorrectes :
        <span id="wrongLetters">—</span>
    </div>

    <div id="lastGuess"></div>

    <div id="status">
        Chargement...
    </div>

    <div id="connection">
        Connexion au chat Twitch...
    </div>

</div>


<script>

const CHANNEL = "electr0fan";

const WORDS_URL =
"https://raw.githubusercontent.com/maxime15/hangman/main/words.txt";

let words = [];
let currentWord = "";

let guessedLetters = new Set();
let wrongLetters = new Set();

let gameOver = false;


// ==========================
// PENDU
// ==========================

const drawings = [

`
   +---+
   |   |
       |
       |
       |
       |
=========`,
`
   +---+
   |   |
   O   |
       |
       |
       |
=========`,
`
   +---+
   |   |
   O   |
   |   |
       |
       |
=========`,
`
   +---+
   |   |
   O   |
  /|   |
       |
       |
=========`,
`
   +---+
   |   |
   O   |
  /|\\  |
       |
       |
=========`,
`
   +---+
   |   |
   O   |
  /|\\  |
  /    |
       |
=========`,
`
   +---+
   |   |
   O   |
  /|\\  |
  / \\  |
       |
=========`
];


// ==========================
// CHARGEMENT DES MOTS
// ==========================

async function loadWords() {

    try {

        const response = await fetch(
            WORDS_URL + "?cache=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("Impossible de charger words.txt");
        }

        const text = await response.text();

        words = text
            .split(/\r?\n/)
            .map(word => word.trim().toUpperCase())
            .filter(word => /^[A-Z]{5,12}$/.test(word));

        if (!words.length) {
            throw new Error("Liste vide");
        }

        startGame();

    } catch (error) {

        document.getElementById("word").textContent =
            "ERREUR";

        document.getElementById("status").textContent =
            "Impossible de charger la liste";
    }
}


// ==========================
// NOUVELLE PARTIE
// ==========================

function startGame() {

    currentWord =
        words[Math.floor(Math.random() * words.length)];

    guessedLetters.clear();
    wrongLetters.clear();

    gameOver = false;

    document.getElementById("lastGuess").textContent = "";

    document.getElementById("status").textContent =
        "Écris UNE lettre dans le chat !";

    updateDisplay();
}


// ==========================
// AFFICHAGE
// ==========================

function updateDisplay() {

    const hiddenWord = currentWord
        .split("")
        .map(letter =>
            guessedLetters.has(letter)
                ? letter
                : "_"
        )
        .join(" ");

    document.getElementById("word").textContent =
        hiddenWord;

    document.getElementById("wrongLetters").textContent =
        wrongLetters.size
            ? Array.from(wrongLetters).join(" ")
            : "—";

    document.getElementById("hangman").textContent =
        drawings[wrongLetters.size];
}


// ==========================
// PROPOSITION
// ==========================

function guessLetter(letter, username) {

    if (gameOver) {
        return;
    }

    letter = letter.trim().toUpperCase();

    if (!/^[A-Z]$/.test(letter)) {
        return;
    }

    // Lettre déjà proposée
    if (
        guessedLetters.has(letter) ||
        wrongLetters.has(letter)
    ) {
        return;
    }


    // BONNE LETTRE

    if (currentWord.includes(letter)) {

        guessedLetters.add(letter);

        document.getElementById("lastGuess").innerHTML =
            `<span class="good">✓ ${letter}</span> trouvé par ` +
            `<span class="username">${escapeHTML(username)}</span>`;

    }


    // MAUVAISE LETTRE

    else {

        wrongLetters.add(letter);

        document.getElementById("lastGuess").innerHTML =
            `<span class="bad">✗ ${letter}</span> proposé par ` +
            `<span class="username">${escapeHTML(username)}</span>`;
    }


    updateDisplay();


    // ==========================
    // VICTOIRE
    // ==========================

    const victory =
        currentWord
            .split("")
            .every(letter =>
                guessedLetters.has(letter)
            );

    if (victory) {

        gameOver = true;

        document.getElementById("word").textContent =
            currentWord;

        document.getElementById("status").innerHTML =
            `🎉 MOT TROUVÉ !<br>` +
            `🏆 <span class="username">${escapeHTML(username)}</span>`;

        setTimeout(startGame, 6000);

        return;
    }


    // ==========================
    // DÉFAITE
    // ==========================

    if (wrongLetters.size >= 6) {

        gameOver = true;

        document.getElementById("word").textContent =
            currentWord;

        document.getElementById("status").innerHTML =
            `💀 PERDU !<br>` +
            `Le mot était <strong>${currentWord}</strong>`;

        setTimeout(startGame, 6000);
    }
}


// ==========================
// SÉCURITÉ AFFICHAGE PSEUDO
// ==========================

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


// ==========================
// RÉCUPÉRATION TAGS TWITCH
// ==========================

function parseTags(line) {

    const tags = {};

    if (!line.startsWith("@")) {
        return tags;
    }

    const tagSection =
        line.substring(1, line.indexOf(" "));

    const tagPairs =
        tagSection.split(";");

    for (const pair of tagPairs) {

        const separator =
            pair.indexOf("=");

        if (separator === -1) {
            continue;
        }

        const key =
            pair.substring(0, separator);

        const value =
            pair.substring(separator + 1);

        tags[key] = value;
    }

    return tags;
}


// ==========================
// TWITCH CHAT
// ==========================

const socket =
    new WebSocket(
        "wss://irc-ws.chat.twitch.tv:443"
    );


socket.addEventListener("open", function () {

    const randomUser =
        "justinfan" +
        Math.floor(Math.random() * 80000 + 1000);

    // IMPORTANT :
    // permet de recevoir display-name
    socket.send(
        "CAP REQ :twitch.tv/tags twitch.tv/commands"
    );

    socket.send(
        "PASS SCHMOOPIIE"
    );

    socket.send(
        "NICK " + randomUser
    );

    socket.send(
        "JOIN #" + CHANNEL.toLowerCase()
    );

    document.getElementById("connection").textContent =
        "Connexion à Twitch...";
});


socket.addEventListener("message", function (event) {

    const lines =
        event.data.split("\r\n");

    for (const line of lines) {


        // PING

        if (line.startsWith("PING")) {

            socket.send(
                "PONG :tmi.twitch.tv"
            );

            continue;
        }


        // CONNEXION AU CHANNEL

        if (
            line.includes(
                "JOIN #" + CHANNEL.toLowerCase()
            )
        ) {

            document.getElementById("connection").textContent =
                "✓ Chat Twitch connecté";
        }


        // MESSAGE CHAT

        if (!line.includes("PRIVMSG")) {
            continue;
        }


        const tags =
            parseTags(line);


        // PSEUDO TWITCH

        let username =
            tags["display-name"];


        // Si display-name indisponible,
        // récupération depuis le message IRC

        if (!username) {

            const userMatch =
                line.match(/:([^!]+)!/);

            username =
                userMatch
                    ? userMatch[1]
                    : "Viewer";
        }


        // CONTENU DU MESSAGE

        const messageMatch =
            line.match(
                /PRIVMSG #[^ ]+ :(.+)$/
            );

        if (!messageMatch) {
            continue;
        }


        const message =
            messageMatch[1]
                .trim()
                .toUpperCase();


        // UNIQUEMENT UNE LETTRE

        if (/^[A-Z]$/.test(message)) {

            guessLetter(
                message,
                username
            );
        }
    }
});


socket.addEventListener("error", function () {

    document.getElementById("connection").textContent =
        "⚠ Erreur connexion Twitch";
});


socket.addEventListener("close", function () {

    document.getElementById("connection").textContent =
        "⚠ Chat Twitch déconnecté";
});


// ==========================
// LANCEMENT
// ==========================

loadWords();

</script>

</body>
</html>

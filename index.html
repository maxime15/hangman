<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pendu Twitch</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #222;
        color: white;
    }

    #game {
        width: 420px;
        height: 460px;
        margin: 0 auto;
        padding-top: 15px;
        text-align: center;
    }

    h1 {
        margin: 0 0 10px 0;
        font-size: 28px;
    }

    #hangman {
        height: 190px;
        white-space: pre;
        font-family: monospace;
        font-size: 24px;
        line-height: 25px;
    }

    #word {
        margin: 10px 0 15px 0;
        font-size: 30px;
        font-weight: bold;
        letter-spacing: 5px;
    }

    #wrong {
        font-size: 17px;
        margin-top: 10px;
    }

    #status {
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
    }

    #connection {
        margin-top: 10px;
        font-size: 13px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<div id="game">

    <h1>LE PENDU</h1>

    <div id="hangman"></div>

    <div id="word">
        CHARGEMENT...
    </div>

    <div id="wrong">
        Lettres incorrectes :
        <span id="wrongLetters">—</span>
    </div>

    <div id="status">
        Chargement de la liste...
    </div>

    <div id="connection">
        Connexion au chat Twitch...
    </div>

</div>

<script>

const CHANNEL = "electr0fan";

const WORDS_URL =
"https://raw.githubusercontent.com/maxime15/hangman/main/words.txt";

let words = [];
let currentWord = "";

let guessedLetters = new Set();
let wrongLetters = new Set();

let gameOver = false;


// =========================
// DESSINS DU PENDU
// =========================

const drawings = [

`
   +---+
   |   |
       |
       |
       |
       |
=========`,

`
   +---+
   |   |
   O   |
       |
       |
       |
=========`,

`
   +---+
   |   |
   O   |
   |   |
       |
       |
=========`,

`
   +---+
   |   |
   O   |
  /|   |
       |
       |
=========`,

`
   +---+
   |   |
   O   |
  /|\\  |
       |
       |
=========`,

`
   +---+
   |   |
   O   |
  /|\\  |
  /    |
       |
=========`,

`
   +---+
   |   |
   O   |
  /|\\  |
  / \\  |
       |
=========`
];


// =========================
// CHARGEMENT DES MOTS
// =========================

async function loadWords() {

    try {

        const response = await fetch(
            WORDS_URL + "?cache=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("Erreur HTTP");
        }

        const text = await response.text();

        words = text
            .split(/\r?\n/)
            .map(word => word.trim().toUpperCase())
            .filter(word => /^[A-Z]{5,12}$/.test(word));

        if (words.length === 0) {
            throw new Error("Liste vide");
        }

        console.log("Mots chargés :", words);

        startGame();

    }

    catch (error) {

        console.error(error);

        document.getElementById("word").textContent =
            "ERREUR";

        document.getElementById("status").textContent =
            "Impossible de charger words.txt";
    }
}


// =========================
// NOUVELLE PARTIE
// =========================

function startGame() {

    currentWord =
        words[Math.floor(Math.random() * words.length)];

    guessedLetters.clear();
    wrongLetters.clear();

    gameOver = false;

    document.getElementById("status").textContent =
        "Écris UNE lettre dans le chat !";

    updateDisplay();
}


// =========================
// AFFICHAGE
// =========================

function updateDisplay() {

    const hiddenWord = currentWord
        .split("")
        .map(letter =>
            guessedLetters.has(letter)
                ? letter
                : "_"
        )
        .join(" ");

    document.getElementById("word").textContent =
        hiddenWord;

    document.getElementById("wrongLetters").textContent =
        wrongLetters.size
            ? Array.from(wrongLetters).join(" ")
            : "—";

    document.getElementById("hangman").textContent =
        drawings[wrongLetters.size];


    // VICTOIRE

    const victory =
        currentWord
            .split("")
            .every(letter =>
                guessedLetters.has(letter)
            );

    if (victory && !gameOver) {

        gameOver = true;

        document.getElementById("word").textContent =
            currentWord;

        document.getElementById("status").textContent =
            "🎉 MOT TROUVÉ !";

        setTimeout(startGame, 5000);
    }


    // DÉFAITE

    if (wrongLetters.size >= 6 && !gameOver) {

        gameOver = true;

        document.getElementById("word").textContent =
            currentWord;

        document.getElementById("status").textContent =
            "💀 PERDU ! Le mot était " + currentWord;

        setTimeout(startGame, 5000);
    }
}


// =========================
// PROPOSITION D'UNE LETTRE
// =========================

function guessLetter(letter) {

    if (gameOver) {
        return;
    }

    letter = letter.trim().toUpperCase();

    if (!/^[A-Z]$/.test(letter)) {
        return;
    }

    if (
        guessedLetters.has(letter) ||
        wrongLetters.has(letter)
    ) {
        return;
    }

    if (currentWord.includes(letter)) {

        guessedLetters.add(letter);

    } else {

        wrongLetters.add(letter);
    }

    updateDisplay();
}


// =========================
// TWITCH CHAT
// =========================

const socket =
    new WebSocket(
        "wss://irc-ws.chat.twitch.tv:443"
    );


socket.addEventListener("open", function () {

    const randomUser =
        "justinfan" +
        Math.floor(Math.random() * 80000 + 1000);

    socket.send(
        "CAP REQ :twitch.tv/tags twitch.tv/commands"
    );

    socket.send(
        "PASS SCHMOOPIIE"
    );

    socket.send(
        "NICK " + randomUser
    );

    socket.send(
        "JOIN #" + CHANNEL.toLowerCase()
    );

    document.getElementById("connection").textContent =
        "Connexion à Twitch...";
});


socket.addEventListener("message", function (event) {

    const lines =
        event.data.split("\r\n");

    for (const line of lines) {


        // PING TWITCH

        if (line.startsWith("PING")) {

            socket.send(
                "PONG :tmi.twitch.tv"
            );

            continue;
        }


        // CONFIRMATION CONNEXION CHANNEL

        if (
            line.includes(
                "JOIN #" + CHANNEL.toLowerCase()
            )
        ) {

            document.getElementById("connection").textContent =
                "✓ Chat Twitch connecté";

        }


        // MESSAGE DU CHAT

        const match =
            line.match(
                /PRIVMSG #[^ ]+ :(.+)$/
            );

        if (!match) {
            continue;
        }

        const message =
            match[1]
                .trim()
                .toUpperCase();


        // ON ACCEPTE UNIQUEMENT
        // UNE SEULE LETTRE

        if (/^[A-Z]$/.test(message)) {

            guessLetter(message);
        }
    }
});


socket.addEventListener("error", function () {

    document.getElementById("connection").textContent =
        "⚠ Erreur connexion Twitch";
});


socket.addEventListener("close", function () {

    document.getElementById("connection").textContent =
        "⚠ Chat Twitch déconnecté";
});


// =========================
// LANCEMENT
// =========================

loadWords();

</script>

</body>
</html>

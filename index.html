<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

#game {
    width: 420px;
    height: 460px;
    margin: auto;
    position: relative;
    text-align: center;
    color: white;
}

/* TITRE */
.title {
    font-size: 25px;
    font-weight: 900;
    margin-top: 8px;
    text-shadow: 0 2px 6px #000;
}

/* PENDU */
.hangman {
    position: relative;
    width: 180px;
    height: 190px;
    margin: 5px auto 0;
}

/* POTENCE */
.base {
    position: absolute;
    width: 130px;
    height: 7px;
    background: white;
    bottom: 0;
    left: 20px;
    border-radius: 4px;
}

.pole {
    position: absolute;
    width: 7px;
    height: 180px;
    background: white;
    left: 45px;
    bottom: 0;
    border-radius: 4px;
}

.top {
    position: absolute;
    width: 100px;
    height: 7px;
    background: white;
    left: 45px;
    top: 10px;
    border-radius: 4px;
}

.rope {
    position: absolute;
    width: 5px;
    height: 30px;
    background: white;
    left: 140px;
    top: 10px;
}

/* BONHOMME */
.part {
    display: none;
    position: absolute;
    background: white;
}

.head {
    width: 38px;
    height: 38px;
    border: 5px solid white;
    background: transparent;
    border-radius: 50%;
    left: 123px;
    top: 38px;
}

.body {
    width: 5px;
    height: 58px;
    left: 140px;
    top: 75px;
}

.arm-left {
    width: 45px;
    height: 5px;
    left: 101px;
    top: 93px;
    transform: rotate(-35deg);
    transform-origin: right;
}

.arm-right {
    width: 45px;
    height: 5px;
    left: 141px;
    top: 93px;
    transform: rotate(35deg);
    transform-origin: left;
}

.leg-left {
    width: 48px;
    height: 5px;
    left: 99px;
    top: 145px;
    transform: rotate(-50deg);
    transform-origin: right;
}

.leg-right {
    width: 48px;
    height: 5px;
    left: 141px;
    top: 145px;
    transform: rotate(50deg);
    transform-origin: left;
}

/* MOT */
#word {
    margin-top: 5px;
    min-height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.letter {
    width: 29px;
    height: 38px;
    border-bottom: 4px solid white;
    font-size: 29px;
    font-weight: 900;
    line-height: 34px;
    text-shadow: 0 2px 5px #000;
}

/* LETTRES FAUSSES */
#wrong {
    margin-top: 9px;
    min-height: 25px;
    font-size: 17px;
    font-weight: bold;
    text-shadow: 0 2px 5px #000;
}

#wrong span {
    margin: 0 4px;
}

/* ETAT CHAT */
#status {
    margin-top: 8px;
    font-size: 13px;
    opacity: 0.8;
    text-shadow: 0 2px 4px #000;
}

/* GAGNANT */
#winner {
    display: none;
    position: absolute;
    left: 15px;
    right: 15px;
    top: 145px;

    padding: 22px 10px;

    background: rgba(0,0,0,0.90);
    border: 3px solid white;
    border-radius: 15px;

    z-index: 100;

    box-shadow: 0 5px 25px rgba(0,0,0,0.7);
}

#winner .trophy {
    font-size: 40px;
}

#winner .found {
    font-size: 17px;
    font-weight: bold;
    margin-top: 4px;
}

#winner .winner-name {
    font-size: 30px;
    font-weight: 900;
    margin-top: 8px;
    word-break: break-word;
}

#winner .word-found {
    font-size: 17px;
    margin-top: 7px;
}

/* PERDU */
#lost {
    display: none;
    position: absolute;
    left: 15px;
    right: 15px;
    top: 155px;

    padding: 22px 10px;

    background: rgba(0,0,0,0.90);
    border: 3px solid white;
    border-radius: 15px;

    z-index: 100;
}

#lost .lost-title {
    font-size: 25px;
    font-weight: 900;
}

#lost .lost-word {
    font-size: 20px;
    margin-top: 10px;
}

</style>
</head>

<body>

<div id="game">

    <div class="title">CHAT HANGMAN</div>

    <div class="hangman">

        <div class="base"></div>
        <div class="pole"></div>
        <div class="top"></div>
        <div class="rope"></div>

        <div class="part head"></div>
        <div class="part body"></div>
        <div class="part arm-left"></div>
        <div class="part arm-right"></div>
        <div class="part leg-left"></div>
        <div class="part leg-right"></div>

    </div>

    <div id="word"></div>

    <div id="wrong"></div>

    <div id="status">Connexion au chat Twitch...</div>

    <div id="winner">
        <div class="trophy">🏆</div>
        <div class="found">MOT TROUVÉ !</div>
        <div class="winner-name" id="winnerName"></div>
        <div class="word-found" id="winnerWord"></div>
    </div>

    <div id="lost">
        <div class="lost-title">💀 PERDU !</div>
        <div class="lost-word" id="lostWord"></div>
    </div>

</div>


<script>

const CHANNEL = "electr0fan";

const WORDS_URL =
"https://raw.githubusercontent.com/maxime15/hangman/main/words.txt";

let words = [];

let currentWord = "";
let guessedLetters = new Set();

let wrongCount = 0;
let roundFinished = false;

const MAX_WRONG = 6;


/* ================================
   CHARGEMENT DES MOTS
================================ */

async function loadWords() {

    try {

        const response = await fetch(
            WORDS_URL + "?cache=" + Date.now()
        );

        const text = await response.text();

        words = text
            .split(/\r?\n/)
            .map(word => word.trim().toUpperCase())
            .filter(word =>
                /^[A-Z]{5,12}$/.test(word)
            );

        if (words.length === 0) {
            throw new Error("Liste vide");
        }

        startGame();

    } catch (error) {

        document.getElementById("status").textContent =
            "Erreur : impossible de charger les mots";

    }

}


/* ================================
   NOUVELLE PARTIE
================================ */

function startGame() {

    roundFinished = false;

    guessedLetters.clear();
    wrongCount = 0;

    document
        .querySelectorAll(".part")
        .forEach(part => {
            part.style.display = "none";
        });

    document.getElementById("winner").style.display = "none";
    document.getElementById("lost").style.display = "none";

    let newWord;

    do {

        newWord =
            words[Math.floor(Math.random() * words.length)];

    } while (
        words.length > 1 &&
        newWord === currentWord
    );

    currentWord = newWord;

    updateDisplay();

}


/* ================================
   AFFICHAGE DU MOT
================================ */

function updateDisplay() {

    const wordContainer =
        document.getElementById("word");

    wordContainer.innerHTML = "";

    for (const letter of currentWord) {

        const box =
            document.createElement("div");

        box.className = "letter";

        if (guessedLetters.has(letter)) {
            box.textContent = letter;
        }

        wordContainer.appendChild(box);

    }


    const wrongLetters =
        [...guessedLetters]
            .filter(letter =>
                !currentWord.includes(letter)
            );

    document.getElementById("wrong").innerHTML =
        wrongLetters.length
            ? "❌ " +
              wrongLetters
                  .map(l => `<span>${l}</span>`)
                  .join("")
            : "";

}


/* ================================
   DESSIN DU PENDU
================================ */

function updateHangman() {

    const parts =
        document.querySelectorAll(".part");

    parts.forEach((part, index) => {

        part.style.display =
            index < wrongCount
                ? "block"
                : "none";

    });

}


/* ================================
   TEST VICTOIRE
================================ */

function wordIsComplete() {

    return [...currentWord]
        .every(letter =>
            guessedLetters.has(letter)
        );

}


/* ================================
   LETTRE PROPOSÉE
================================ */

function guessLetter(letter, username) {

    if (roundFinished) return;

    letter =
        letter.toUpperCase();

    if (!/^[A-Z]$/.test(letter)) return;

    if (guessedLetters.has(letter)) return;


    guessedLetters.add(letter);


    if (!currentWord.includes(letter)) {

        wrongCount++;

        updateHangman();
        updateDisplay();

        if (wrongCount >= MAX_WRONG) {

            loseGame();

        }

        return;

    }


    updateDisplay();


    /*
       IMPORTANT :
       Le viewer qui envoie LA LETTRE
       qui complète le mot gagne.
    */

    if (wordIsComplete()) {

        winGame(username);

    }

}


/* ================================
   VICTOIRE
================================ */

function winGame(username) {

    roundFinished = true;

    document.getElementById("winnerName").textContent =
        username || "Viewer";

    document.getElementById("winnerWord").textContent =
        currentWord;

    document.getElementById("winner").style.display =
        "block";


    setTimeout(() => {

        startGame();

    }, 6000);

}


/* ================================
   DÉFAITE
================================ */

function loseGame() {

    roundFinished = true;

    document.getElementById("lostWord").textContent =
        "Le mot était : " + currentWord;

    document.getElementById("lost").style.display =
        "block";


    setTimeout(() => {

        startGame();

    }, 6000);

}


/* ================================
   TWITCH IRC
================================ */

function connectTwitch() {

    const socket =
        new WebSocket(
            "wss://irc-ws.chat.twitch.tv:443"
        );


    socket.onopen = () => {

        /*
           On demande les TAGS Twitch.
           C'est ça qui nous permet
           de récupérer display-name.
        */

        socket.send(
            "CAP REQ :twitch.tv/tags twitch.tv/commands"
        );

        socket.send(
            "PASS SCHMOOPIIE"
        );

        socket.send(
            "NICK justinfan" +
            Math.floor(Math.random() * 99999)
        );

        socket.send(
            "JOIN #" + CHANNEL
        );


        document.getElementById("status").textContent =
            "✓ Chat Twitch connecté";

    };


    socket.onmessage = event => {

        const messages =
            event.data.split("\r\n");


        for (const message of messages) {

            if (!message) continue;


            /* PING TWITCH */

            if (message.startsWith("PING")) {

                socket.send(
                    "PONG :tmi.twitch.tv"
                );

                continue;

            }


            if (!message.includes("PRIVMSG")) {
                continue;
            }


            /*
               MESSAGE IRC TYPE :

               @badge-info=...;display-name=Maxime;...
               :maxime!maxime@...
               PRIVMSG #electr0fan :A
            */


            const privmsgIndex =
                message.indexOf("PRIVMSG");

            if (privmsgIndex === -1) continue;


            const textStart =
                message.indexOf(" :", privmsgIndex);

            if (textStart === -1) continue;


            const chatMessage =
                message
                    .substring(textStart + 2)
                    .trim();


            /*
               On accepte uniquement
               une lettre seule.
            */

            if (!/^[a-zA-Z]$/.test(chatMessage)) {
                continue;
            }


            /* ========================
               RÉCUPÉRATION DU PSEUDO
            ======================== */

            let username = "Viewer";


            /*
               Première tentative :
               display-name Twitch
            */

            const displayNameMatch =
                message.match(
                    /(?:^|;)display-name=([^;]*)/
                );


            if (
                displayNameMatch &&
                displayNameMatch[1]
            ) {

                username =
                    displayNameMatch[1];

            } else {

                /*
                   Fallback :
                   pseudo IRC
                */

                const prefixMatch =
                    message.match(
                        /:([^!]+)!/
                    );

                if (prefixMatch) {

                    username =
                        prefixMatch[1];

                }

            }


            guessLetter(
                chatMessage,
                username
            );

        }

    };


    socket.onerror = () => {

        document.getElementById("status").textContent =
            "⚠ Erreur connexion Twitch";

    };


    socket.onclose = () => {

        document.getElementById("status").textContent =
            "Reconnexion au chat Twitch...";

        setTimeout(
            connectTwitch,
            5000
        );

    };

}


/* ================================
   DÉMARRAGE
================================ */

loadWords();
connectTwitch();

</script>

</body>
</html>
